<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | SolarUp</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100svh;
    display:grid;place-items:center;
    padding:2rem;
    font-family:"Archivo",system-ui,sans-serif;
    line-height:1.65;
    color:#fff;
    background:
      radial-gradient(circle at 50% 24%,rgba(254,211,23,.22) 0%,transparent 58%),
      #08080A;
    text-align:center;
  }
  .box{max-width:34rem}
  img{width:min(210px,60vw);height:auto;margin-inline:auto;margin-bottom:2.2rem}
  .code{
    font-size:clamp(4rem,18vw,7rem);font-weight:900;font-style:italic;
    letter-spacing:-.05em;line-height:1;color:#FED317;
  }
  h1{font-size:clamp(1.4rem,1.1rem + 1.4vw,1.9rem);font-weight:900;margin:.9rem 0 .7rem;letter-spacing:-.02em}
  p{color:rgba(255,255,255,.66);margin-bottom:2rem}
  .btn{
    display:inline-flex;align-items:center;gap:.5rem;
    padding:.95rem 1.8rem;
    font-weight:800;color:#0A0A0C;background:#FED317;
    border-radius:999px;text-decoration:none;
    box-shadow:0 12px 30px -10px rgba(254,211,23,.5);
    transition:transform .18s ease;
  }
  .btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <main class="box">
    <img src="/assets/img/logo-header.webp" alt="SolarUp">
    <p class="code">404</p>
    <h1>Esta página se nos apagó</h1>
    <p>El enlace que buscas no existe o cambió de lugar. Volvamos a donde sí hay energía.</p>
    <a class="btn" href="/">Ir al inicio</a>
  </main>
</body>
</html>
